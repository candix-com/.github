name: Bug
description: The code doesn't do what it's meant to.
type: Bug
body:
  - type: textarea
    attributes:
      label: The problem
      description: What is wrong or missing, as facts. Mark any idea about the cause or the fix as speculation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Found while
      description: What you were doing when you found it.
