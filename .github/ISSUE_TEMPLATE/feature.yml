name: Feature
description: The code should do something it doesn't do yet.
type: Feature
body:
  - type: textarea
    attributes:
      label: Problem
      description: What is wrong or missing, as facts.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Impact
      description: Who or what it hurts, and how.
  - type: textarea
    attributes:
      label: Context
      description: How it came up, and any guess at the cause or solution, marked as a guess.
