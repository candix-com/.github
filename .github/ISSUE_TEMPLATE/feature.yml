name: Feature
description: The code should do something it doesn't do yet.
type: Feature
body:
  - type: textarea
    attributes:
      label: The problem
      description: What is wrong or missing, as facts.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Impact
      description: Who or what it hurts, and how. If users can hit a bug, assume they are hitting it.
  - type: textarea
    attributes:
      label: Context
      description: What you were doing when you found it, and any guess at the cause or fix, marked as such.
