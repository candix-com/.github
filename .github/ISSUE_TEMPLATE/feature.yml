name: Feature
description: The code should do something it doesn't do yet.
type: Feature
body:
  - type: textarea
    attributes:
      label: The problem
      description: What is wrong or missing, as facts. Mark any idea about the cause or the fix as speculation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Found while
      description: What you were doing when you found it.
